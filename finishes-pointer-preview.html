<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Extended Properties - the next finishes</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /*
        The harness only, kept for looking at the finishes over a range of
        fills without opening a vault. It loads the plugin's own stylesheet,
        so what is shown here is what ships; the watcher below is the same one
        the plugin installs (see src/ui/render/lamp.ts).
      */
      body {
        margin: 0;
        padding: 28px;
        background: #1b1b1f;
        color: #dcddde;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
      p.note { color: #9a9aa2; max-width: 60ch; margin: 0 0 20px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
      .cell { display: grid; gap: 6px; }
      .name { color: #9a9aa2; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
      /* Stands in for a formatted row: a fill with a legible foreground. */
      .row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 12px; border-radius: 8px; font-weight: 600;
        background: var(--fill); color: var(--fg);
      }
      .row .unit { opacity: .8; font-weight: 400; }
      .swatches { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
      .swatches button {
        border: 1px solid #3a3a42; background: #26262c; color: #dcddde;
        border-radius: 999px; padding: 4px 12px; cursor: pointer; font: inherit;
      }
      .swatches button[aria-pressed="true"] { background: #4c6ef5; border-color: #4c6ef5; color: #fff; }
    </style>
  </head>
  <body>
    <h1>The next finishes</h1>
    <p class="note">
      Move the pointer across the swatches: each one is lit from where the pointer
      stands on it, so the light crosses the sheet one swatch at a time and fades
      as it leaves. Pick a fill to see every finish over a different colour.
    </p>
    <div class="swatches" id="fills"></div>
    <div class="grid" id="grid"></div>

    <script>
      // The finishes, in the order the settings would offer them.
      const FINISHES = [
        "matte", "sheen", "mirror", "foil", "spectra", "prism", "opal",
        "nebula", "beacon", "glitter", "crackle", "satin", "weave",
        "relief", "hammered",
      ];
      const FILLS = ["#8b1e3f", "#1f6f8b", "#2f7a45", "#7a5c1f", "#4b3f8b", "#c7ccd1", "#2a2a30"];

      /** Black or white, whichever can be read on the fill (as the plugin does). */
      const readableOn = (hex) => {
        const n = parseInt(hex.slice(1), 16);
        const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
          const s = v / 255;
          return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
        });
        const l = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
        return (l + 0.05) / 0.05 >= 1.05 / (l + 0.05) ? "#000000" : "#ffffff";
      };

      const grid = document.getElementById("grid");
      const draw = (fill) => {
        grid.textContent = "";
        for (const id of FINISHES) {
          const cell = document.createElement("div");
          cell.className = "cell";
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = id;
          const row = document.createElement("div");
          row.className = "row ep-fin ep-fin-" + id;
          row.style.setProperty("--fill", fill);
          row.style.setProperty("--fg", readableOn(fill));
          row.innerHTML = '<span>Strength</span><span>18 <span class="unit">mod</span></span>';
          cell.append(name, row);
          grid.append(cell);
        }
      };

      const fills = document.getElementById("fills");
      FILLS.forEach((hex, i) => {
        const b = document.createElement("button");
        b.style.background = hex;
        b.style.color = readableOn(hex);
        b.textContent = hex;
        b.setAttribute("aria-pressed", String(i === 0));
        b.onclick = () => {
          for (const other of fills.children) other.setAttribute("aria-pressed", "false");
          b.setAttribute("aria-pressed", "true");
          draw(hex);
        };
        fills.append(b);
      });
      draw(FILLS[0]);

      /*
        The lamp, in the shape the plugin installs it (src/ui/render/lamp.ts).

        One listener, one frame of work - but the numbers are worked out per
        value, from where the pointer stands on THAT value. The frame reads
        every box first and writes every property afterwards, so the browser
        lays the page out once rather than once per swatch.
      */
      const FALLOFF = 2.6;
      const clamp = (n, lo, hi) => (n < lo ? lo : n > hi ? hi : n);

      const lightFor = (box, px, py) => {
        const overX = (px - box.left) / (box.width || 1);
        const overY = (py - box.top) / (box.height || 1);
        const outX = overX - 0.5;
        const outY = overY - 0.5;
        const away = Math.hypot(outX, outY) * 2;
        const near = clamp(1 - (away - 1) / FALLOFF, 0, 1);
        const x = clamp(overX, -0.5, 1.5);
        const y = clamp(overY, -0.5, 1.5);
        const dx = x - 0.5;
        const dy = y - 0.5;
        const reach = Math.min(1, Math.hypot(dx, dy) * 2);
        const turn = (Math.atan2(dy, dx) * 180) / Math.PI + 180;
        return {
          "--ep-lamp-x": (x * 100).toFixed(2) + "%",
          "--ep-lamp-y": (y * 100).toFixed(2) + "%",
          "--ep-lamp-dx": (dx * 100).toFixed(2) + "%",
          "--ep-lamp-dy": (dy * 100).toFixed(2) + "%",
          "--ep-lamp-reach": reach.toFixed(3),
          "--ep-lamp-turn": turn.toFixed(1) + "deg",
          "--ep-lamp-near": near.toFixed(3),
        };
      };

      const PROPS = ["x", "y", "dx", "dy", "reach", "turn", "near"];
      const resting = new WeakSet();
      let queued = false;
      let px = 0;
      let py = 0;
      const write = () => {
        queued = false;
        const lit = Array.from(document.querySelectorAll(".ep-fin"));
        const boxes = lit.map((el) => el.getBoundingClientRect());
        lit.forEach((el, i) => {
          const vals = lightFor(boxes[i], px, py);
          if (vals["--ep-lamp-near"] === "0.000") {
            if (resting.has(el)) return;
            resting.add(el);
            for (const p of PROPS) el.style.removeProperty("--ep-lamp-" + p);
            return;
          }
          resting.delete(el);
          for (const [k, v] of Object.entries(vals)) el.style.setProperty(k, v);
        });
      };
      const refresh = () => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(write);
      };
      window.addEventListener("pointermove", (e) => {
        px = e.clientX;
        py = e.clientY;
        refresh();
      }, { passive: true });
      // Scrolling moves the values under a pointer that has not moved at all.
      document.addEventListener("scroll", refresh, { passive: true, capture: true });
      // Hand the lamp back, so nothing is left lit from a corner it has left.
      document.addEventListener("pointerleave", () => {
        for (const el of document.querySelectorAll(".ep-fin")) {
          for (const p of PROPS) el.style.removeProperty("--ep-lamp-" + p);
        }
      });
    </script>
  </body>
</html>
